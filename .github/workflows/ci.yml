name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ESPHome
        run: pip install -r requirements.txt

      # ESP-IDF toolchain and framework downloads.
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/esphome
            ~/.platformio
          key: toolchain-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # example.yaml with the github:// package swapped for the checked-out copy,
      # plus dummy secrets.
      - name: Prepare test config
        run: |
          mkdir -p .test
          sed 's#^  omlet: github://.*#  omlet: !include ../omlet-fan.yaml#' example.yaml > .test/example.yaml
          grep -q '!include ../omlet-fan.yaml' .test/example.yaml
          printf 'wifi_ssid: test\nwifi_password: testtesttest\n' > .test/secrets.yaml

      - name: Validate config
        run: esphome config .test/example.yaml

      - name: Logic test
        run: tests/run.sh

      - name: Compile
        run: esphome compile .test/example.yaml
